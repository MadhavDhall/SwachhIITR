services:
  - type: web
    name: wasteos-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wasteos-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: wasteos/scans
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: wasteos-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: YOLO_MODEL_PATH
        value: models/yolov8n_waste.pt
      - key: DATABASE_URL
        fromDatabase:
          name: wasteos-db
          property: connectionString

databases:
  - name: wasteos-db
    plan: free
    databaseName: wasteos
    user: wasteos
